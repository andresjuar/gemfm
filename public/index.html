<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>gem.fm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">gem<span>.</span>fm</div>
      <div class="top-right">
        <span class="points" id="points">0 pts</span>
        <button class="avatar" id="me-btn" aria-label="My profile"></button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs" aria-label="Main">
      <button data-tab="discover" class="tab active">Discover</button>
      <button data-tab="live" class="tab">Live</button>
      <button data-tab="friends" class="tab">Friends</button>
    </nav>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <div id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
