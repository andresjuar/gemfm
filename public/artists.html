<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>gem.fm for Artists</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" style="padding-bottom:32px">
    <header class="top">
      <div class="brand">gem<span>.</span>fm <span class="small muted" style="font-family:var(--body);font-weight:600">for artists</span></div>
      <a class="btn small" href="/" style="text-decoration:none">Back to app</a>
    </header>
    <main class="view">
      <form class="panel" id="new-artist" style="display:flex;flex-direction:column;gap:12px">
        <span class="eyebrow">Join as an artist</span>
        <div class="field"><label for="a-name">Artist name</label><input id="a-name" required></div>
        <div class="field"><label for="a-genre">Genre</label><input id="a-genre" required placeholder="Indie rock"></div>
        <div class="field"><label for="a-city">City</label><input id="a-city" value="Guadalajara"></div>
        <div class="field"><label for="a-bio">Short bio</label><input id="a-bio" maxlength="140"></div>
        <div class="field"><label for="a-spotify">Spotify link</label><input id="a-spotify" placeholder="https://open.spotify.com/track/…"></div>
        <button class="btn primary">Add artist</button>
      </form>

      <form class="panel" id="new-gig" style="display:flex;flex-direction:column;gap:12px">
        <span class="eyebrow">Announce a gig</span>
        <div class="field"><label for="g-artist">Artist</label><select id="g-artist"></select></div>
        <div class="field"><label for="g-venue">Venue</label><select id="g-venue"></select></div>
        <div class="field"><label for="g-date">Date and time</label><input id="g-date" type="datetime-local" required></div>
        <div class="field"><label for="g-price">Price (MXN, 0 = free)</label><input id="g-price" type="number" min="0" value="0"></div>
        <button class="btn primary">Add gig</button>
      </form>

      <section style="display:flex;flex-direction:column;gap:10px">
        <span class="eyebrow">Artists and their Spotify tracks</span>
        <p class="small muted" style="margin:0">In Spotify, open a song, tap Share › Copy link and paste it here.</p>
        <div id="list" class="stamps"></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script>
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; setTimeout(() => (t.hidden = true), 2200); }
    async function api(path, method = 'GET', body) {
      const r = await fetch('/api' + path, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Something went wrong.');
      return d;
    }
    async function load() {
      const [artists, venues] = await Promise.all([api('/artists'), api('/venues')]);
      $('#g-artist').innerHTML = artists.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
      $('#g-venue').innerHTML = venues.map((v) => `<option value="${v.id}">${esc(v.name)} · ${esc(v.area)}</option>`).join('');
      $('#list').innerHTML = artists.map((a) => `
        <form class="panel" data-id="${a.id}" style="display:flex;flex-direction:column;gap:8px">
          <div class="row between"><b>${esc(a.name)}</b><span class="chip">${a.saves} fans</span></div>
          <div class="row"><input value="${esc(a.spotify_url)}" placeholder="Paste Spotify link" aria-label="Spotify link for ${esc(a.name)}">
          <button class="btn small">Save</button></div>
        </form>`).join('');
    }
    $('#list').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { await api('/artists/' + e.target.dataset.id, 'PATCH', { spotify_url: e.target.querySelector('input').value.trim() }); toast('Spotify link saved'); }
      catch (err) { toast(err.message); }
    });
    $('#new-artist').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/artists', 'POST', { name: $('#a-name').value, genre: $('#a-genre').value, city: $('#a-city').value, bio: $('#a-bio').value, spotify_url: $('#a-spotify').value.trim() });
        e.target.reset(); $('#a-city').value = 'Guadalajara'; toast('Artist added'); load();
      } catch (err) { toast(err.message); }
    };
    $('#new-gig').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/gigs', 'POST', { artistId: $('#g-artist').value, venueId: $('#g-venue').value, startsAt: $('#g-date').value, price: $('#g-price').value });
        toast('Gig added'); e.target.reset();
      } catch (err) { toast(err.message); }
    };
    load();
  </script>
</body>
</html>
